name: VulnAgent Groq End-to-End

on:
  workflow_dispatch:
  push:
    branches:
      - enable-github-actions-output

permissions:
  contents: read
  issues: write

jobs:
  end-to-end:
    name: Run VulnAgent with Groq
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-20b
      LLM_TIMEOUT_SECONDS: 120
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      VULNAGENT_CREATE_GITHUB_ISSUES: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify required secrets are configured
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY GitHub repository secret is not configured."
            exit 1
          fi
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is not available."
            exit 1
          fi

      - name: Run VulnAgent end-to-end
        run: |
          python run_vulnagent.py \
            --bandit-report samples/bandit_raw_output.json \
            --output reports/triage_results.json

      - name: Upload triage results
        uses: actions/upload-artifact@v4
        with:
          name: vulnagent-triage-results
          path: reports/triage_results.json

      - name: Upload escalation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnagent-escalations
          path: reports/escalations_log.jsonl
          if-no-files-found: ignore
